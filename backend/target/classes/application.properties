# =========================================================
# JPA / HIBERNATE
# =========================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=syncboard
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# =========================================================
# JWT
# =========================================================
jwt.secret=Y2hhbmdlLXRoaXMtdG8tYS1sb25nLXNlY3JldC1rZXktZm9yLXN5bmNib2FyZC1qd3Q=
# 15 minutes in milliseconds
jwt.access-token-expiration=900000
# 7 days in milliseconds
jwt.refresh-token-expiration=604800000

# =========================================================
# COOKIE SETTINGS
# =========================================================
# Set to true in production (HTTPS only)
app.cookie.secure=false
# SameSite policy: Lax (good for SPA), Strict (max security), None (cross-site)
app.cookie.same-site=Lax
# Access token expiry (seconds) - 15 minutes
app.cookie.access-max-age=900
# Refresh token expiry (seconds) - 7 days
app.cookie.refresh-max-age=604800

# =========================================================
# LOGGING (dev only)
# =========================================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.example.docworkspace=DEBUG